name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The analytics engine has no dependencies (ADR-003), so this job needs no
  # install step and no services. It is the fastest possible signal on the most
  # correctness-critical code in the product, and it guards that property: if
  # someone adds an import to backend/algorithms/, this job fails.
  analytics:
    name: Analytics engine (zero dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert the engine imports with no third-party packages
        run: python -c "import backend.algorithms as a; print(a.__version__)"
      - name: Assert the footprint compiler imports with no third-party packages
        run: python -c "import backend.squeeze as s; print(s.__version__)"
      - name: Run the analytics suite
        run: python -m unittest discover -s tests/algorithms -t . -v
      - name: Run the footprint language suite
        run: python -m unittest discover -s tests/squeeze -t . -v

      # The footprint gate. `--strict` fails on an exceeded limit and on an
      # unprovable one: a policy whose coverage dropped below 100% has stopped
      # showing that the product fits in its storage budget, and that is the
      # thing this gate exists to catch. `verify` fails when a declared codec
      # ratio has drifted above what the codec actually achieves.
      - name: Footprint policy is provably within its limits
        run: python -m backend.squeeze plan policies/footprint.sqz --strict
      - name: Declared codec ratios still hold
        run: python -m backend.squeeze verify policies/footprint.sqz --strict

  quality:
    name: Lint, types and architecture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests
      - run: ruff format --check backend tests
      - run: mypy --strict backend/algorithms backend/squeeze
      - name: Architecture contract (docs/01 §3)
        run: lint-imports --config pyproject.toml

  tests:
    name: Integration and security tests
    runs-on: ubuntu-latest
    needs: [analytics]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # The ephemeral CI database is built by applying the reviewed migration
      # files in order. This is NOT auto-migration of a real database — it is how
      # CI obtains a schema that provably matches what a developer would apply.
      - name: Build the test schema from the reviewed migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d test --set ON_ERROR_STOP=on -f "$f"
          done

      - name: Verify row-level security is actually enforced
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test --set ON_ERROR_STOP=on -c "
            SELECT rolname, rolsuper, rolbypassrls FROM pg_roles
            WHERE rolname IN ('app_rw','app_ro');"

      - run: pytest -q -m "not ai_eval"

      # Hard gate. No override, no skip — see docs/09 §8.
      - name: Security suite
        run: pytest -q -m security

  security-audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline || detect-secrets scan
