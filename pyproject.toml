[project]
name = "ai-sports-coach"
version = "0.1.0"
description = "AI Sports Coach Platform — backend and analytics engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Async fixtures share the test's function-scoped loop. Set explicitly so the
# suite does not depend on a pytest-asyncio default that is scheduled to change.
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
markers = [
    "security: tenant isolation, auth, webhook and ledger tests — cannot be skipped",
    "integration: needs Postgres and Redis",
    "slow: excluded from the fast local loop",
    "ai_eval: costs money; runs nightly, not per commit",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit — security
    "C4",        # comprehensions
    "DTZ",       # naive datetime usage: every timestamp must be tz-aware
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "DTZ001"]   # fixture secrets and fixed dates are intentional
# `__table_args__` and `__tablename__` are SQLAlchemy's declarative contract: a
# dict/tuple assigned at class scope is how the framework is configured, not a
# mutable-shared-state bug, so ClassVar annotations would add noise for no safety.
"backend/**/models.py" = ["RUF012"]
# The domain error hierarchy deliberately reads as HTTP-shaped nouns
# (`NotFound`, `Conflict`, `InvalidCredentials`) rather than `...Error`. The names
# are the API contract; renaming them for a suffix convention would be churn.
"backend/core/errors.py" = ["N818"]
# Same convention, extended to the layers that raise into that hierarchy:
# `ProviderUnavailable` / `ProviderTokenExpired` / `ProviderRateLimited` name the
# condition a caller must handle, and `DecryptionFailed` names an outcome. Adding an
# `Error` suffix to some but not all of the hierarchy would be worse than either
# convention applied consistently.
"backend/integrations/base.py" = ["N818"]
"backend/core/crypto.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The analytics engine is the layer that must never drift.
module = "backend.algorithms.*"
strict = true

# -----------------------------------------------------------------------------
# Architecture contract — the layering rule from docs/01 §3, enforced in CI.
# A violation here is a design regression, not a style issue.
# -----------------------------------------------------------------------------
[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "The analytics engine depends on nothing in this project"
type = "forbidden"
source_modules = ["backend.algorithms"]
forbidden_modules = [
    "backend.api",
    "backend.modules",
    "backend.integrations",
    "backend.workers",
    "backend.database",
    "backend.core",
]

[[tool.importlinter.contracts]]
name = "Layers are respected"
type = "layers"
# Parenthesised layers are optional: they are enforced once the package exists
# and ignored until then, so the contract stays green through the phased build
# (integrations lands in Phase 1 weeks 3–4) without ever going un-enforced for a
# layer that does exist.
layers = [
    "backend.api",
    "backend.modules",
    "(backend.integrations)",
    "backend.algorithms",
]

[[tool.importlinter.contracts]]
name = "Modules are independent — cross-module access goes through service only"
type = "independence"
# Lists the modules that exist today. The `independence` contract has no optional
# syntax, so a module that has not been created yet cannot be named here without
# failing the whole run. RULE FOR REVIEWERS: adding `backend/modules/<name>/` and
# not adding it to this list is a contract regression — the drift check in
# tests/architecture guards against exactly that omission.
modules = [
    "backend.modules.identity",
    "backend.modules.training",
]

[[tool.importlinter.contracts]]
name = "The API layer never touches repositories or ORM models directly"
type = "forbidden"
source_modules = ["backend.api"]
# Direct imports only. The API calls a module's `service`, and that service
# legitimately imports its own `repository` and `models` — forbidding the
# transitive chain would ban the API from calling any service at all. What must
# never happen is API code itself writing `import ...repository`, which this
# still catches.
allow_indirect_imports = true
# Only the repositories that exist can be named; a forbidden module that does not
# exist fails the run. Extended per module as each is built (see the reviewer rule
# on the independence contract above).
forbidden_modules = [
    "backend.modules.identity.repository",
    "backend.modules.identity.models",
    "backend.modules.training.repository",
    "backend.modules.training.models",
]
