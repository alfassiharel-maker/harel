# CCP's own pytest configuration.
#
# Present as a separate file, and passed explicitly with `-c`, because this
# directory currently sits inside an unrelated repository whose own pyproject.toml
# pytest section would otherwise be picked up as the root configuration.
[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    slow: excluded from the fast loop; multi-megabyte artifacts
